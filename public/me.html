<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b6e4f">
<title>Message Assistant</title>
<link rel="manifest" href="/manifest.webmanifest?v=__V__">
<link rel="icon" type="image/svg+xml" href="/icon.svg?v=__V__">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=__V__">
<link rel="apple-touch-icon" href="/icon-192.png?v=__V__">
<link rel="stylesheet" href="/style.css?v=__V__">
</head>
<body class="me">
<div id="login" class="screen hidden">
  <div class="card narrow">
    <img src="/icon.svg?v=__V__" class="logo big" width="72" height="72" alt="">
    <h1 id="lTitle">Message Assistant</h1>
    <p class="muted">Your chat on the web</p>
    <form id="fPhone">
      <label>Your phone number<input id="lPhone" type="tel" autocomplete="tel" placeholder="+1 646 555 0100" required></label>
      <button class="primary" type="submit">Text me a code</button>
    </form>
    <form id="fCode" class="hidden">
      <label>6-digit code<input id="lCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456" required></label>
      <button class="primary" type="submit">Sign in</button>
      <button type="button" class="link" id="codeBack">Use another number</button>
    </form>
    <p id="loginMsg" class="msg"></p>
  </div>
</div>
<div id="app" class="screen hidden">
  <header><img src="/icon.svg?v=__V__" class="logo" width="28" height="28" alt=""><span id="brand">Message Assistant</span><button id="logout" class="link">Sign out</button></header>
  <main id="chat" class="chat"></main>
  <form id="compose" class="compose"><textarea id="text" rows="1" placeholder="Message" autocomplete="off"></textarea><button class="primary" type="submit" id="sendBtn">Send</button></form>
  <p id="sendMsg" class="msg center"></p>
</div>
<script type="module" src="/me.js?v=__V__"></script>
</body>
</html>
